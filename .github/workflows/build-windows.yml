name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Official prebuilt llama.cpp release (ggml-org/llama.cpp). Nothing is compiled in CI.
  # The Vulkan zip contains llama-server + the Vulkan backend + CPU backends for every CPU generation
  # (SSE4.2 / AVX / AVX2 / AVX-512 ...), picked automatically at run time. "latest" also works here.
  LLAMA_CPP_TAG: b10621

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read app version
        shell: bash
        run: echo "APP_VERSION=$(python tools/get_version.py)" >> "$GITHUB_ENV"

      # llama.cpp backend: Vulkan (AMD / Intel / NVIDIA) + all CPU variants
      - name: Download llama.cpp (Vulkan + CPU)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p llama-dl
          if [ "$LLAMA_CPP_TAG" = "latest" ]; then TAGARG=""; else TAGARG="$LLAMA_CPP_TAG"; fi
          gh release download $TAGARG --repo ggml-org/llama.cpp --pattern "llama-*-bin-win-vulkan-x64.zip" --dir llama-dl
          ls -l llama-dl

      - name: Extract llama.cpp
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem llama-dl\*.zip).FullName -DestinationPath llama-bin -Force
          $srv = Get-ChildItem llama-bin -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $srv) { throw "llama-server.exe not found in the downloaded archive - check LLAMA_CPP_TAG and the asset name" }
          "LLAMA_BIN_DIR=$($srv.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem $srv.DirectoryName | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # Python app (PyInstaller, one-dir)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Build app with PyInstaller
        run: pyinstaller notus.spec --noconfirm --clean

      # Backend into dist\Notus\backend + app-local Microsoft Visual C++ runtime (no vc_redist needed)
      - name: Assemble backend folder
        shell: pwsh
        run: |
          $backend = "dist\Notus\backend"
          New-Item -ItemType Directory -Force $backend | Out-Null
          Copy-Item "$env:LLAMA_BIN_DIR\*" $backend -Recurse -Force

          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue |
                 Sort-Object FullName | Select-Object -Last 1
          if ($crt) { Copy-Item (Join-Path $crt.FullName "*.dll") $backend -Force } else { Write-Warning "MSVC CRT folder not found" }

          if (-not (Test-Path "$backend\llama-server.exe")) { throw "llama-server.exe missing in backend" }
          Get-ChildItem $backend | Measure-Object Length -Sum | ForEach-Object { "backend size: {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: Smoke test
        shell: pwsh
        env:
          NOTUS_DATA_DIR: ${{ runner.temp }}\notus-selftest
        run: |
          $p = Start-Process "dist\Notus\Notus.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Notus --selftest failed with exit code $($p.ExitCode)" }
          & "dist\Notus\backend\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe does not start (exit code $LASTEXITCODE) - a DLL is probably missing" }
          & "dist\Notus\backend\llama-server.exe" --list-devices
          exit 0

      # Inno Setup installer
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notus-Windows-Setup
          path: Output/Notus-Setup-${{ env.APP_VERSION }}.exe
          compression-level: 0

      # Creates the release v<version> if needed and attaches the installer.
      # To publish a new release, bump __version__ in notus/__init__.py.
      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${APP_VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Notus ${APP_VERSION}" --generate-notes --target "$GITHUB_SHA" || true
          gh release upload "$TAG" "Output/Notus-Setup-${APP_VERSION}.exe" --clobber
